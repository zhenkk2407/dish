{% extends 'recipes/base.html' %}

{% block content %}
<h2>Категория: {{ category.name }}</h2>

<ul>
    {% for recipe in recipes %}
        <li><a href="{% url 'recipe_detail' recipe.id %}">{{ recipe.title }}</a></li>
    {% empty %}
        <li>Нет рецептов в этой категории.</li>
    {% endfor %}
</ul>
{% endblock %}
